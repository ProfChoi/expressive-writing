<script id="eg-runtime">
(function(){
  function getData(){
    var el = document.getElementById('eg-pages-data');
    if(!el) throw new Error('통합 페이지 데이터를 찾을 수 없습니다.');
    return JSON.parse(el.textContent || '{}');
  }
  function decodeUtf8Base64(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  function escScript(s){ return String(s).replace(/<\/script/gi, '<\\/script'); }
  function makeExtra(){
    var data = document.getElementById('eg-pages-data').textContent || '{}';
    var runtime = document.getElementById('eg-runtime').textContent || '';
    return '\n<script id="eg-pages-data" type="application/json">' + escScript(data) + '</' + 'script>' +
           '\n<script id="eg-runtime">' + escScript(runtime) + '</' + 'script>\n';
  }
  function insertBeforeBodyEnd(html, extra){
    if(/<\/body>/i.test(html)) return html.replace(/<\/body>/i, extra + '</body>');
    return html + extra;
  }
  var DESIGN_KEY = 'expressiveWritingDesign.v1';
  function rememberDesign(key){
    try {
      if(key === 'classic' || key === 'warm'){
        window.localStorage && window.localStorage.setItem(DESIGN_KEY, key);
        window.sessionStorage && window.sessionStorage.removeItem('egSkipAuto');
      } else if(key === 'select'){
        window.sessionStorage && window.sessionStorage.setItem('egSkipAuto', '1');
      }
    } catch(e) {}
  }
  window.__egShowPage = function(key){
    key = key || 'select';
    rememberDesign(key);
    var data = getData();
    if(!data[key]) throw new Error('페이지 데이터를 찾을 수 없습니다: ' + key);
    var html = decodeUtf8Base64(data[key]);
    html = insertBeforeBodyEnd(html, makeExtra());
    document.open();
    document.write(html);
    document.close();
  };
  window.__egResetData = function(){
    var ok = window.confirm('이 브라우저에 저장된 글쓰기 내용과 자기평가 데이터를 모두 삭제할까요?\n삭제 후에는 되돌릴 수 없습니다.');
    if(!ok) return;
    try { window.localStorage && window.localStorage.removeItem('expressiveWritingStandalone.v1'); } catch(e) {}
    try { window.localStorage && window.localStorage.removeItem(DESIGN_KEY); } catch(e) {}
    try { window.sessionStorage && window.sessionStorage.setItem('egSkipAuto','1'); } catch(e) {}
    alert('브라우저 저장 데이터가 초기화되었습니다.');
  };
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if(!a) return;
    var page = a.getAttribute('data-eg-page');
    if(page){ e.preventDefault(); window.__egShowPage(page); }
  }, true);

  function isSelectPage(){
    var dc = document.querySelector('x-dc');
    var src = dc ? dc.innerHTML : '';
    return src.indexOf('data-eg-page="classic"') > -1 && src.indexOf('data-eg-page="warm"') > -1;
  }
  var IS_SELECT_PAGE = false;
  try { IS_SELECT_PAGE = isSelectPage(); } catch(e) {}
  function maybeAutoOpen(){
    try {
      if(!IS_SELECT_PAGE) return;
      var skip = window.sessionStorage && window.sessionStorage.getItem('egSkipAuto');
      var saved = window.localStorage && window.localStorage.getItem(DESIGN_KEY);
      if(!skip && (saved === 'classic' || saved === 'warm')){
        window.__egShowPage(saved);
      }
    } catch(e) {}
  }
  if(document.readyState === 'complete'){ setTimeout(maybeAutoOpen, 0); }
  else { window.addEventListener('load', function(){ setTimeout(maybeAutoOpen, 0); }); }
})();
</script>
